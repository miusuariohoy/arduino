<polyline points="241,90 420,90 420,104" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="241,200 360,200 360,164" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="241,140 450,140" fill="none" stroke="#e8663d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="410" y="107" width="80" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="450" cy="135" r="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><path d="M450 135 L463 122" stroke="#e8663d" stroke-width="3"/><text x="450" y="187" text-anchor="middle" class="etq">Potenciómetro 10 kΩ</text><text x="450" y="208" text-anchor="middle" class="small">0 – 1023 en analogRead(A0)</text>
