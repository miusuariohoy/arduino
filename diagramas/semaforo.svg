<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Semáforo con tres LEDs">

  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#1e293b}
    .titulo{font-size:20px;font-weight:700;fill:#00695c}
    .pin{font-size:13px;font-weight:700;fill:#f8fafc}
    .etq{font-size:13px}
    .small{font-size:11px;fill:#64748b}
    .board{font-size:16px;font-weight:700;fill:#e0f2f1;letter-spacing:1px}
  </style>

  <rect width="640" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="32" y="36" class="titulo">Semáforo con tres LEDs</text>
  <text x="608" y="36" text-anchor="end" class="small">Rojo = 5 V · Negro = GND · Naranja = señal</text>
<rect x="24" y="52" width="210" height="170" rx="18" fill="#00979c" stroke="#00695c" stroke-width="3"/><text x="129" y="82" text-anchor="middle" class="board">ARDUINO UNO</text><rect x="42" y="96" width="168" height="104" rx="8" fill="#e0f2f1" opacity=".35"/><circle cx="234" cy="90" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="95" text-anchor="end" class="pin">D8</text><circle cx="234" cy="140" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="145" text-anchor="end" class="pin">D9</text><circle cx="234" cy="190" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="195" text-anchor="end" class="pin">D10</text><circle cx="234" cy="220" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="225" text-anchor="end" class="pin">GND</text>
