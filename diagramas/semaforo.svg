/><text x="450" y="228" text-anchor="middle" class="etq">Verde</text><polyline points="450,207 520,207 520,220 241,220" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="245" text-anchor="middle" class="small">Un LED encendido a la vez · delay(1000)</text>
