<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-label="Arduino Uno: recursos usados en el curso">

  <defs>
    <linearGradient id="tablero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a6a6"/>
      <stop offset="100%" stop-color="#00796b"/>
    </linearGradient>
    <linearGradient id="pantalla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8d8"/>
      <stop offset="100%" stop-color="#a9ccb8"/>
    </linearGradient>
  </defs>

  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#1e293b}
    .titulo{font-size:19px;font-weight:700;fill:#00695c}
    .board{font-size:15px;font-weight:700;fill:#e0f2f1;letter-spacing:1px}
    .pin{font-size:10.5px;font-weight:700;fill:#f8fafc}
    .etq{font-size:12px;font-weight:600}
    .small{font-size:10.5px;fill:#64748b}
    .tiny{font-size:9px;fill:#334155}
    .solda{fill:#f59e0b;stroke:#ffffff;stroke-width:1.4}
    .patita{fill:#cbd5e1;stroke:#475569;stroke-width:1}
  </style>

  <rect width="640" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="32" y="34" text-anchor="start" class="titulo">Arduino Uno: recursos usados en el curso</text>
  <rect x="20" y="52" width="220" height="190" rx="16" fill="url(#tablero)" stroke="#005b52" stroke-width="3"/><rect x="4" y="88" width="30" height="38" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><rect x="9" y="94" width="20" height="26" rx="2" fill="#94a3b8"/><rect x="8" y="196" width="36" height="28" rx="5" fill="#111827" stroke="#475569" stroke-width="2"/><circle cx="26" cy="210" r="7" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="60" y="150" width="66" height="20" rx="3" fill="#111827" stroke="#334155"/><rect x="132" y="152" width="38" height="16" rx="2" fill="#111827" stroke="#334155"/><rect x="60" y="102" width="16" height="16" rx="2" fill="#111827" stroke="#334155"/><rect x="60" y="128" width="12" height="8" rx="2" fill="#22c55e" stroke="#ffffff" stroke-width="1"/><text x="66" y="126" text-anchor="middle" class="tiny">ON</text><rect x="82" y="128" width="12" height="8" rx="2" fill="#facc15" stroke="#ffffff" stroke-width="1"/><text x="88" y="126" text-anchor="middle" class="tiny">L</text><rect x="104" y="128" width="12" height="8" rx="2" fill="#facc15" stroke="#ffffff" stroke-width="1"/><text x="110" y="126" text-anchor="middle" class="tiny">TX</text><rect x="126" y="128" width="12" height="8" rx="2" fill="#facc15" stroke="#ffffff" stroke-width="1"/><text x="132" y="126" text-anchor="middle" class="tiny">RX</text><rect x="204" y="62" width="28" height="166" rx="4" fill="#111827" opacity=".96"/><text x="112" y="74" text-anchor="middle" class="board">ARDUINO UNO</text><text x="112" y="190" text-anchor="middle" class="tiny">DIGITAL  ·  ANALÓGICO</text>
  <text x="300" y="84" text-anchor="start" class="etq">14 pines digitales D0–D13</text><text x="300" y="120" text-anchor="start" class="etq">6 entradas analógicas A0–A5</text><text x="300" y="156" text-anchor="start" class="etq">PWM: 3, 5, 6, 9, 10 y 11</text><text x="300" y="192" text-anchor="start" class="etq">Regulares 5 V, 3,3 V y varios GND</text><text x="300" y="228" text-anchor="start" class="small">LED integrado en D13 · carga por USB</text><polyline points="218,90 286,90" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/><polyline points="218,90 286,90" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="218,140 286,140" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/><polyline points="218,140 286,140" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="218,180 286,180" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/><polyline points="218,180 286,180" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="218,220 286,220" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/><polyline points="218,220 286,220" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="198" y="94" text-anchor="end" class="pin">D13</text><circle cx="218" cy="90" r="5.4" fill="#ffffff" opacity=".16"/><circle cx="218" cy="90" r="3.6" class="solda"/><text x="198" y="144" text-anchor="end" class="pin">A0</text><circle cx="218" cy="140" r="5.4" fill="#ffffff" opacity=".16"/><circle cx="218" cy="140" r="3.6" class="solda"/><text x="198" y="184" text-anchor="end" class="pin">5V</text><circle cx="218" cy="180" r="5.4" fill="#ffffff" opacity=".16"/><circle cx="218" cy="180" r="3.6" class="solda"/><text x="198" y="224" text-anchor="end" class="pin">GND</text><circle cx="218" cy="220" r="5.4" fill="#ffffff" opacity=".16"/><circle cx="218" cy="220" r="3.6" class="solda"/>
  <line x1="32" y1="272" x2="58" y2="272" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><text x="64" y="276" text-anchor="start" class="tiny">5 V</text><line x1="104" y1="272" x2="130" y2="272" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/><text x="136" y="276" text-anchor="start" class="tiny">GND</text><line x1="182" y1="272" x2="208" y2="272" stroke="#e8663d" stroke-width="4" stroke-linecap="round"/><text x="214" y="276" text-anchor="start" class="tiny">Señal</text><line x1="266" y1="272" x2="292" y2="272" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="298" y="276" text-anchor="start" class="tiny">Datos</text><text x="608" y="276" text-anchor="end" class="tiny">Esquema de conexión · Arduino Uno</text>
</svg>
