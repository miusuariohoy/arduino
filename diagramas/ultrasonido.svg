<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Sensor ultrasónico HC-SR04">

  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#1e293b}
    .titulo{font-size:20px;font-weight:700;fill:#00695c}
    .pin{font-size:13px;font-weight:700;fill:#f8fafc}
    .etq{font-size:13px}
    .small{font-size:11px;fill:#64748b}
    .board{font-size:16px;font-weight:700;fill:#e0f2f1;letter-spacing:1px}
  </style>

  <rect width="640" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="32" y="36" class="titulo">Sensor ultrasónico HC-SR04</text>
  <text x="608" y="36" text-anchor="end" class="small">Rojo = 5 V · Negro = GND · Naranja = señal</text>
<rect x="24" y="52" width="210" height="170" rx="18" fill="#00979c" stroke="#00695c" stroke-width="3"/><text x="129" y="82" text-anchor="middle" class="board">ARDUINO UNO</text><rect x="42" y="96" width="168" height="104" rx="8" fill="#e0f2f1" opacity=".35"/><circle cx="234" cy="110" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="115" text-anchor="end" class="pin">D9</text><circle cx="234" cy="150" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="155" text-anchor="end" class="pin">D10</text><circle cx="234" cy="200" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="205" text-anchor="end" class="pin">GND</text><circle cx="234" cy="75" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="80" text-anchor="end" class="pin">5V</text>
<polyline points="241,110 390,110 390,102 420,102" fill="none" stroke="#e8663d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="241,150 420,150" fill="none" stroke="#e8663d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="241,200 420,200" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="241,75 420,75" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="438" y="95" width="124" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/><circle cx="472" cy="129" r="16" fill="#94a3b8" stroke="#e2e8f0" stroke-width="2"/><circle cx="528" cy="129" r="16" fill="#94a3b8" stroke="#e2e8f0" stroke-width="2"/><text x="500" y="163" text-anchor="middle" fill="#e2e8f0" class="etq">HC-SR04</text><text x="500" y="197" text-anchor="middle" class="small">TRIG D9 · ECHO D10</text>
