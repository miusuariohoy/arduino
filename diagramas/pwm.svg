<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="PWM: potenciómetro y LED en D9">

  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#1e293b}
