<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Sensor DHT11 real">

  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#1e293b}
    .titulo{font-size:20px;font-weight:700;fill:#00695c}
    .pin{font-size:13px;font-weight:700;fill:#f8fafc}
    .etq{font-size:13px}
    .small{font-size:11px;fill:#64748b}
    .board{font-size:16px;font-weight:700;fill:#e0f2f1;letter-spacing:1px}
  </style>

  <rect width="640" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="32" y="36" class="titulo">Sensor DHT11 real</text>
  <text x="608" y="36" text-anchor="end" class="small">Rojo = 5 V · Negro = GND · Naranja = señal</text>
<rect x="24" y="52" width="210" height="170" rx="18" fill="#00979c" stroke="#00695c" stroke-width="3"/><text x="129" y="82" text-anchor="middle" class="board">ARDUINO UNO</text><rect x="42" y="96" width="168" height="104" rx="8" fill="#e0f2f1" opacity=".35"/><circle cx="234" cy="130" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="135" text-anchor="end" class="pin">D2</text><circle cx="234" cy="200" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="205" text-anchor="end" class="pin">GND</text><circle cx="234" cy="80" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="85" text-anchor="end" class="pin">5V</text><circle cx="234" cy="95" r="7" fill="#fde047" stroke="#ffffff" stroke-width="2"/><text x="222" y="100" text-anchor="end" class="pin">D13</text>
<polyline points="241,80 430,80 430,100" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="241,200 420,200 420,155" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="241,130 470,130 470,110 445,110" fill="none" stroke="#e8663d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="470" y="150" width="64" height="22" rx="5" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="502" y="166" text-anchor="middle" class="etq">4,7 kΩ</text><polyline points="470,161 470,200 420,200" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="385" y="92" width="90" height="76" rx="5" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="402" cy="110" r="3" fill="#94a3b8"/><circle cx="416" cy="110" r="3" fill="#94a3b8"/><circle cx="430" cy="110" r="3" fill="#94a3b8"/><circle cx="444" cy="110" r="3" fill="#94a3b8"/><circle cx="458" cy="110" r="3" fill="#94a3b8"/><text x="430" y="140" text-anchor="middle" class="etq">DHT11</text><text x="430" y="188" text-anchor="middle" class="small">DATA D2 + pull-up 4,7 kΩ</text><polyline points="241,95 320,95" fill="none" stroke="#e8663d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="320" y="84" width="64" height="22" rx="5" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="352" y="100" text-anchor="middle" class="etq">220 Ω</text><polyline points="384,95 330,95" fill="none" stroke="#e8663d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="232" text-anchor="middle" class="small">En Tinkercad usar TMP36 en A2</text>
